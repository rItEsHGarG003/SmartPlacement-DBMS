{% extends "base.html" %}
{% block title %}Register | SmartPlacement{% endblock %}
{% block content %}
<div class="auth-card">
    <h1>Student Registration</h1>
    <form method="post">
        <label>Name</label>
        <input name="name" required>
        <label>Email</label>
        <input type="email" name="email" required>
        <label>Password</label>
        <input type="password" name="password" required>
        <label>Course</label>
        <input name="course" value="MCA" required>
        <label>CGPA</label>
        <input type="number" name="cgpa" min="0" max="10" step="0.01" required>
        <label>Skills (comma separated)</label>
        <input name="skills" placeholder="C++, Python, SQL">
        <label>Graduation Year</label>
        <input type="number" name="graduation_year" value="2027" required>
        <button type="submit">Register</button>
    </form>
    <p><a href="{{ url_for('login') }}">Back to login</a></p>
</div>
{% endblock %}
