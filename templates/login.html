{% extends "base.html" %}

{% block title %}Login | SmartPlacement{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <!-- BRAND -->

        <div class="auth-header">

            <div class="auth-logo">
                SP
            </div>

            <h1>
                Welcome back
            </h1>

            <p>
                Sign in to your SmartPlacement account
            </p>

        </div>


        <!-- LOGIN FORM -->

        <form method="post">

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    id="email"
                    type="email"
                    name="email"
                    required
                    autocomplete="email"
                    placeholder="you@example.com"
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    name="password"
                    required
                    autocomplete="current-password"
                    placeholder="Enter your password"
                >

            </div>


            <button
                type="submit"
                class="auth-button"
            >
                Login
            </button>

        </form>


        <!-- REGISTER LINK -->

        <div class="auth-footer">

            <p>
                New student?

                <a href="{{ url_for('register') }}">
                    Create an account
                </a>
            </p>

        </div>


        <!-- DEMO CREDENTIALS -->

        <div class="demo-box">

            <div class="demo-title">
                Demo Credentials
            </div>

            <div class="demo-item">
                <strong>Student</strong>
                <span>ritesh@student.com / 1234</span>
            </div>

            <div class="demo-item">
                <strong>Admin</strong>
                <span>admin@smartplacement.com / admin123</span>
            </div>

        </div>

    </div>

</div>

{% endblock %}
